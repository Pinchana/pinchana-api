[project]
name = "pinchana-soundcloud"
version = "26.11.7"
description = "SoundCloud music downloader for Pinchana"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pinchana-core",
    "fastapi>=0.162.2",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
pinchana-core = { path = "../pinchana-core" }

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
