name: Publish Docker images

on:
  push:
    branches: [main, stable]
    tags: ['v*.*.*']
    paths:
      - '.github/workflows/docker-publish.yml'
      - 'docker-compose.yml'
      - 'pinchana-*/**'
      - 'pinchana-*'
  workflow_dispatch:
    inputs:
      services:
        description: 'Comma-separated list of services to build (empty = auto-detect)'
        required: false
        default: ''
      release_version:
        description: 'Optional Docker tag to publish, e.g. 0.2.beta'
        required: false
        default: ''
      publish_stable:
        description: 'Also publish the stable Docker tag'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  validate-dlp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Test DLP protocol and worker
        working-directory: pinchana-dlp
        run: uv run --with-requirements requirements-test.txt pytest -q

      - name: Test authenticated gateway
        working-directory: pinchana-server
        run: uv run --with pytest pytest -q

      - name: Validate production Compose profiles
        run: |
          docker compose config --quiet
          docker compose --profile dlp config --quiet

  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Detect changed services
        id: set-matrix
        run: |
          # If manual trigger with explicit services, use those
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.services }}" ]]; then
            IFS=',' read -ra SERVICES <<< "${{ github.event.inputs.services }}"
            matrix='{"include": ['
            first=1
            for svc in "${SERVICES[@]}"; do
              svc="$(echo "$svc" | xargs)"
              [[ -z "$svc" ]] && continue
              [[ $first -eq 0 ]] && matrix+=","
              matrix+="{\"service\": \"$svc\"}"
              first=0
            done
            matrix+="]}"
            echo "matrix=$matrix" >> $GITHUB_OUTPUT
            echo "Manual build for: ${SERVICES[*]}"
            exit 0
          fi

          # Manual stable/versioned releases default to all services.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && ( "${{ github.event.inputs.publish_stable }}" == "true" || -n "${{ github.event.inputs.release_version }}" ) ]]; then
            echo 'matrix={"include": [{"service":"server"},{"service":"tiktok"},{"service":"instagram"},{"service":"shorts"},{"service":"soundcloud"},{"service":"ytmusic"},{"service":"spotify"},{"service":"deezer"},{"service":"threads"},{"service":"twitter"},{"service":"dlp-api"},{"service":"dlp-orchestrator"},{"service":"dlp-worker"}]}' >> $GITHUB_OUTPUT
            echo "Manual release build — building all services"
            exit 0
          fi

          # For tags, build everything
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo 'matrix={"include": [{"service":"server"},{"service":"tiktok"},{"service":"instagram"},{"service":"shorts"},{"service":"soundcloud"},{"service":"ytmusic"},{"service":"spotify"},{"service":"deezer"},{"service":"threads"},{"service":"twitter"},{"service":"dlp-api"},{"service":"dlp-orchestrator"},{"service":"dlp-worker"}]}' >> $GITHUB_OUTPUT
            echo "Tag push — building all services"
            exit 0
          fi

          # Detect changed files
          CHANGED=$(git diff --name-only HEAD~1 HEAD || true)
          echo "Changed files:"
          echo "$CHANGED"

          # If workflow or compose changed, build everything
          if echo "$CHANGED" | grep -qE '^\.github/workflows/docker-publish\.yml|^docker-compose\.yml$'; then
            echo 'matrix={"include": [{"service":"server"},{"service":"tiktok"},{"service":"instagram"},{"service":"shorts"},{"service":"soundcloud"},{"service":"ytmusic"},{"service":"spotify"},{"service":"deezer"},{"service":"threads"},{"service":"twitter"},{"service":"dlp-api"},{"service":"dlp-orchestrator"},{"service":"dlp-worker"}]}' >> $GITHUB_OUTPUT
            echo "Workflow/compose changed — building all services"
            exit 0
          fi

          # If pinchana-core changed, build everything (all services depend on it)
          if echo "$CHANGED" | grep -qE '^pinchana-core/|^pinchana-core$'; then
            echo 'matrix={"include": [{"service":"server"},{"service":"tiktok"},{"service":"instagram"},{"service":"shorts"},{"service":"soundcloud"},{"service":"ytmusic"},{"service":"spotify"},{"service":"deezer"},{"service":"threads"},{"service":"twitter"},{"service":"dlp-api"},{"service":"dlp-orchestrator"},{"service":"dlp-worker"}]}' >> $GITHUB_OUTPUT
            echo "pinchana-core changed — building all services"
            exit 0
          fi

          # Build only services whose submodules changed
          matrix='{"include": ['
          first=1
          for svc in server tiktok instagram shorts soundcloud ytmusic spotify deezer threads twitter dlp-api dlp-orchestrator dlp-worker; do
            dir="pinchana-${svc}"
            # Service name 'instagram' maps to the pinchana-inst/ submodule
            [ "$svc" = "instagram" ] && dir="pinchana-inst"
            [[ "$svc" == dlp-* ]] && dir="pinchana-dlp"
            # Match both dir/ (files inside) and dir itself (submodule pointer update)
            if echo "$CHANGED" | grep -qE "^${dir}/|^${dir}$"; then
              [[ $first -eq 0 ]] && matrix+=","
              matrix+="{\"service\": \"$svc\"}"
              first=0
            fi
          done
          matrix+="]}"

          echo "matrix=$matrix" >> $GITHUB_OUTPUT
          echo "Selective matrix: $matrix"

  build-and-push:
    needs: [detect, validate-dlp]
    if: ${{ fromJson(needs.detect.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Map service to Dockerfile
        id: map
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "context=." >> $GITHUB_OUTPUT
          case "${{ matrix.service }}" in
            server)     echo "dockerfile=./pinchana-server/Dockerfile" >> $GITHUB_OUTPUT; echo "image=$REPO_LOWER/server" >> $GITHUB_OUTPUT ;;
            tiktok)     echo "dockerfile=./pinchana-tiktok/Dockerfile" >> $GITHUB_OUTPUT; echo "image=$REPO_LOWER/tiktok" >> $GITHUB_OUTPUT ;;
            instagram)  echo "dockerfile=./pinchana-inst/Dockerfile" >> $GITHUB_OUTPUT; echo "image=$REPO_LOWER/instagram" >> $GITHUB_OUTPUT ;;
            shorts)     echo "dockerfile=./pinchana-shorts/Dockerfile" >> $GITHUB_OUTPUT; echo "image=$REPO_LOWER/shorts" >> $GITHUB_OUTPUT ;;
            soundcloud) echo "dockerfile=./pinchana-soundcloud/Dockerfile" >> $GITHUB_OUTPUT; echo "image=$REPO_LOWER/soundcloud" >> $GITHUB_OUTPUT ;;
            ytmusic)    echo "dockerfile=./pinchana-ytmusic/Dockerfile" >> $GITHUB_OUTPUT; echo "image=$REPO_LOWER/ytmusic" >> $GITHUB_OUTPUT ;;
            spotify)    echo "dockerfile=./pinchana-spotify/Dockerfile" >> $GITHUB_OUTPUT; echo "image=$REPO_LOWER/spotify" >> $GITHUB_OUTPUT ;;
            deezer)     echo "dockerfile=./pinchana-deezer/Dockerfile" >> $GITHUB_OUTPUT; echo "image=$REPO_LOWER/deezer" >> $GITHUB_OUTPUT ;;
            threads)    echo "dockerfile=./pinchana-threads/Dockerfile" >> $GITHUB_OUTPUT; echo "image=$REPO_LOWER/threads" >> $GITHUB_OUTPUT ;;
            twitter)    echo "dockerfile=./pinchana-twitter/Dockerfile" >> $GITHUB_OUTPUT; echo "image=$REPO_LOWER/twitter" >> $GITHUB_OUTPUT ;;
            dlp-api)          echo "context=./pinchana-dlp/api" >> $GITHUB_OUTPUT; echo "dockerfile=./pinchana-dlp/api/Dockerfile" >> $GITHUB_OUTPUT; echo "image=$REPO_LOWER/dlp-api" >> $GITHUB_OUTPUT ;;
            dlp-orchestrator) echo "context=./pinchana-dlp/orchestrator" >> $GITHUB_OUTPUT; echo "dockerfile=./pinchana-dlp/orchestrator/Dockerfile" >> $GITHUB_OUTPUT; echo "image=$REPO_LOWER/dlp-orchestrator" >> $GITHUB_OUTPUT ;;
            dlp-worker)       echo "context=./pinchana-dlp/worker" >> $GITHUB_OUTPUT; echo "dockerfile=./pinchana-dlp/worker/Dockerfile" >> $GITHUB_OUTPUT; echo "image=$REPO_LOWER/dlp-worker" >> $GITHUB_OUTPUT ;;
          esac

      - name: Compute public build manifest
        id: build-info
        run: |
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "commits=$(python scripts/build_manifest.py)" >> "$GITHUB_OUTPUT"

      - name: Compute release tags
        id: release-tags
        run: |
          image="${{ env.REGISTRY }}/${{ steps.map.outputs.image }}"
          tags=""

          add_tag() {
            local tag="$1"
            if [[ -n "$tag" ]]; then
              tags+="${image}:${tag}"$'\n'
            fi
          }

          if [[ "${{ github.ref }}" == "refs/heads/stable" || "${GITHUB_REF_TYPE}" == "tag" || "${{ github.event.inputs.publish_stable }}" == "true" ]]; then
            add_tag "stable"
          fi

          if [[ -n "${{ github.event.inputs.release_version }}" ]]; then
            add_tag "${{ github.event.inputs.release_version }}"
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            add_tag "${GITHUB_REF_NAME#v}"
          fi

          {
            echo "tags<<EOF"
            printf "%s" "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.map.outputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.map.outputs.context }}
          file: ${{ steps.map.outputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.release-tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PINCHANA_BUILD_COMMIT=${{ steps.build-info.outputs.commit }}
            PINCHANA_BUILD_COMMITS=${{ steps.build-info.outputs.commits }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.map.outputs.image }}:build-cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.map.outputs.image }}:build-cache,mode=max,ignore-error=true
