name: Publish Docker images

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/docker-publish.yml'
      - 'VERSION'
      - 'docker-compose*.yml'
      - 'scripts/version.py'
      - 'pinchana-*/**'
      - 'pinchana-*'
  workflow_dispatch:
    inputs:
      services:
        description: 'Images to build (server, dlp-api, dlp-orchestrator, dlp-worker). Empty auto-detects.'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Validate product version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            python scripts/version.py check --tag "$RELEASE_TAG"
          else
            python scripts/version.py check
          fi

      - name: Test rolling updater
        run: python -m unittest discover -s scripts/tests -v

      - name: Test DLP protocol and worker
        working-directory: pinchana-dlp
        run: uv run --with-requirements requirements-test.txt pytest -q

      - name: Test authenticated gateway
        working-directory: pinchana-server
        run: uv run --with pytest pytest -q

      - name: Test music download scope isolation
        run: |
          for module in pinchana-core pinchana-ytmusic pinchana-spotify pinchana-deezer pinchana-soundcloud; do
            uv run --directory "$module" --with pytest --with pytest-asyncio python -m pytest -q
          done

      - name: Test TikTok format selection and extraction
        working-directory: pinchana-tiktok
        run: uv run --with pytest --with pytest-asyncio python -m pytest -q

      - name: Test Apple Music tracks
        working-directory: pinchana-apple-music
        run: uv run --with pytest pytest -q

      - name: Test Coub scraper
        working-directory: pinchana-coub
        run: uv run pytest -q

      - name: Validate Compose profiles
        run: |
          docker compose config --quiet
          docker compose --profile dlp config --quiet
          docker compose -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.dev.yml --profile dlp config --quiet

  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Detect changed services
        id: set-matrix
        env:
          REQUESTED_SERVICES: ${{ inputs.services }}
          PREVIOUS_COMMIT: ${{ github.event.before }}
        run: |
          all=(server dlp-api dlp-orchestrator dlp-worker)
          selected=()
          if [[ -n "$REQUESTED_SERVICES" ]]; then
            IFS=',' read -ra requested <<< "$REQUESTED_SERVICES"
            for service in "${requested[@]}"; do
              service="$(echo "$service" | xargs)"
              case "$service" in
                server|dlp-api|dlp-orchestrator|dlp-worker) selected+=("$service") ;;
                *) echo "::error::Unsupported image: $service"; exit 1 ;;
              esac
            done
          elif [[ "$GITHUB_REF" == refs/tags/* || -z "$PREVIOUS_COMMIT" ]] ||
               ! git cat-file -e "$PREVIOUS_COMMIT^{commit}" 2>/dev/null; then
            selected=("${all[@]}")
          else
            changed=$(git diff --name-only "$PREVIOUS_COMMIT" "$GITHUB_SHA")
            if grep -qE '^VERSION$|^scripts/version\.py$|^\.github/workflows/docker-publish\.yml$|^docker-compose(\.dev)?\.yml$' <<< "$changed"; then
              selected=("${all[@]}")
            else
              # A change in any bundled package changes the server image.
              if grep -E '^pinchana-' <<< "$changed" | grep -qvE '^pinchana-dlp(/|$)'; then
                selected+=(server)
              fi
              if grep -qE '^pinchana-dlp(/|$)' <<< "$changed"; then
                selected+=(dlp-api dlp-orchestrator dlp-worker)
              fi
            fi
          fi
          matrix=$(printf '%s\n' "${selected[@]}" | jq -Rc '{service: .} | select(.service != "")' | jq -sc 'unique | {include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: [detect, validate]
    if: ${{ fromJson(needs.detect.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Map service to Dockerfile
        id: map
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "context=." >> $GITHUB_OUTPUT
          case "${{ matrix.service }}" in
            server)     echo "dockerfile=./pinchana-server/Dockerfile" >> $GITHUB_OUTPUT; echo "image=$REPO_LOWER/server" >> $GITHUB_OUTPUT ;;
            dlp-api)          echo "context=./pinchana-dlp/api" >> $GITHUB_OUTPUT; echo "dockerfile=./pinchana-dlp/api/Dockerfile" >> $GITHUB_OUTPUT; echo "image=$REPO_LOWER/dlp-api" >> $GITHUB_OUTPUT ;;
            dlp-orchestrator) echo "context=./pinchana-dlp/orchestrator" >> $GITHUB_OUTPUT; echo "dockerfile=./pinchana-dlp/orchestrator/Dockerfile" >> $GITHUB_OUTPUT; echo "image=$REPO_LOWER/dlp-orchestrator" >> $GITHUB_OUTPUT ;;
            dlp-worker)       echo "context=./pinchana-dlp/worker" >> $GITHUB_OUTPUT; echo "dockerfile=./pinchana-dlp/worker/Dockerfile" >> $GITHUB_OUTPUT; echo "image=$REPO_LOWER/dlp-worker" >> $GITHUB_OUTPUT ;;
          esac

      - name: Compute public build manifest
        id: build-info
        run: |
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "commits=$(python scripts/build_manifest.py)" >> "$GITHUB_OUTPUT"

      - name: Compute image tags and build version
        id: image-tags
        run: |
          image="${{ env.REGISTRY }}/${{ steps.map.outputs.image }}"
          product_version="$(python scripts/version.py show)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            build_version="$product_version"
            tag_suffixes="$(python scripts/version.py docker-tags)"
          else
            build_version="${product_version}+dev.${GITHUB_SHA:0:12}"
            tag_suffixes="latest"
          fi

          {
            echo "version=$build_version"
            echo "primary=$(printf '%s\n' "$tag_suffixes" | head -n 1)"
            echo "tags<<EOF"
            while IFS= read -r suffix; do
              [[ -n "$suffix" ]] && echo "${image}:${suffix}"
            done <<< "$tag_suffixes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.map.outputs.image }}
          tags: |
            type=raw,value=${{ steps.image-tags.outputs.primary }}
          labels: |
            org.opencontainers.image.version=${{ steps.image-tags.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.map.outputs.context }}
          file: ${{ steps.map.outputs.dockerfile }}
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PINCHANA_BUILD_VERSION=${{ steps.image-tags.outputs.version }}
            PINCHANA_BUILD_COMMIT=${{ steps.build-info.outputs.commit }}
            PINCHANA_BUILD_COMMITS=${{ steps.build-info.outputs.commits }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.map.outputs.image }}:build-cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.map.outputs.image }}:build-cache,mode=max,ignore-error=true
