name: Publish Docker images

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - '.github/workflows/docker-publish.yml'
      - 'docker-compose.yml'
      - 'pinchana-*/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: server
            image: ${{ github.repository }}/server
            dockerfile: ./pinchana-server/Dockerfile
          - service: tiktok
            image: ${{ github.repository }}/tiktok
            dockerfile: ./pinchana-tiktok/Dockerfile
          - service: instagram
            image: ${{ github.repository }}/instagram
            dockerfile: ./pinchana-inst/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
