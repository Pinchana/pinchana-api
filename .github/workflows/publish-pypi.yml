name: Publish Python packages to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build
        required: true
        type: string
      projects:
        description: Comma-separated PyPI project names, or all
        required: true
        default: pinchana-core
        type: string
      publish:
        description: Upload the selected distributions to PyPI
        default: false
        type: boolean
      resume:
        description: Skip files already uploaded in a partial release
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'release' && 'pypi-release' || 'pypi-build' }}-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Start PyPI publishing on the default branch
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch all packages
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh workflow run publish-pypi.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
            -f "release_tag=$RELEASE_TAG" -f projects=all -f publish=true

  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.distributions.outputs.packages }}
      bundle: ${{ steps.distributions.outputs.bundle }}
    steps:
      - name: Validate tag format
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]{2}\.(0[1-9]|1[0-2])\.[1-9][0-9]*$ ]]; then
            echo "Enter an existing release tag such as v26.11.15."
            exit 1
          fi

      - name: Check out the tagged release
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release ancestry
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"

      - name: Build and validate distributions
        id: distributions
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PYPI_PROJECTS: ${{ inputs.projects }}
        run: |
          matrix=$(python scripts/build_pypi.py \
            --tag "$RELEASE_TAG" --projects "$PYPI_PROJECTS" --out-dir dist/pypi)
          uvx twine check --strict dist/pypi/*/*.whl dist/pypi/*/*.tar.gz
          jq -r '"packages=\(.include |= map(select(.project != "pinchana-scraper")) | tojson)"' \
            <<< "$matrix" >> "$GITHUB_OUTPUT"
          jq -r '"bundle=\(any(.include[]; .project == "pinchana-scraper"))"' \
            <<< "$matrix" >> "$GITHUB_OUTPUT"

      - name: Store distributions
        uses: actions/upload-artifact@v7
        with:
          name: pypi-distributions
          path: dist/pypi/
          if-no-files-found: error

  publish:
    needs: build
    if: >-
      inputs.publish &&
      fromJSON(needs.build.outputs.packages).include[0] != null &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Publish ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.packages) }}
    environment:
      name: ${{ matrix.environment }}
      url: https://pypi.org/project/${{ matrix.project }}/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: pypi-distributions
          path: dist/

      - name: Upload this package to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: dist/${{ matrix.project }}/
          skip-existing: ${{ inputs.resume }}

  publish-bundle:
    needs: [build, publish]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      needs.build.outputs.bundle == 'true' && inputs.publish &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Publish pinchana-scraper
    runs-on: ubuntu-latest
    environment:
      name: pypi-pinchana-scraper
      url: https://pypi.org/project/pinchana-scraper/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: pypi-distributions
          path: dist/

      - name: Upload the bundle to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: dist/pinchana-scraper/
          skip-existing: ${{ inputs.resume }}
