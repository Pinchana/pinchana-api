services:
  gluetun:
    image: qmcgaw/gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8080:8080"      # Server API
      - "8000:8000"      # Gluetun control server
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-nordvpn}
      - OPENVPN_USER=${NORDVPN_USER:-}
      - OPENVPN_PASSWORD=${NORDVPN_PASSWORD:-}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:-}
      - HTTP_CONTROL_SERVER_API_KEY=${GLUETUN_API_KEY:-secret-key}
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/v1/vpn/status"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - scraper-cache:/app/cache

  server:
    build:
      context: .
      dockerfile: ./pinchana-server/Dockerfile
    network_mode: container:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
      tiktok:
        condition: service_started
      instagram:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - scraper-cache:/app/cache
      - ./config:/app/config:ro
    environment:
      - CONTAINER_MODE=true
      - MODULES_CONFIG=/app/config/modules.yaml
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}
      - GLUETUN_CONTROL_URL=http://localhost:8000
      - GLUETUN_API_KEY=${GLUETUN_API_KEY:-secret-key}

  tiktok:
    build:
      context: .
      dockerfile: ./pinchana-tiktok/Dockerfile
    network_mode: container:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - scraper-cache:/app/cache
    environment:
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}

  instagram:
    build:
      context: .
      dockerfile: ./pinchana-inst/Dockerfile
    network_mode: container:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - scraper-cache:/app/cache
    environment:
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}

volumes:
  scraper-cache:
