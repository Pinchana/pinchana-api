services:
  gluetun:
    image: ${GLUETUN_IMAGE:-qmcgaw/gluetun:latest}
    container_name: ${GLUETUN_CONTAINER_NAME:-gluetun}
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${API_HOST_PORT:-8080}:8080"                         # Server API
      - "${TIKTOK_HOST_PORT:-8081}:8081"                     # TikTok scraper
      - "${INSTAGRAM_HOST_PORT:-8082}:8082"                  # Instagram scraper
      - "${SHORTS_HOST_PORT:-8083}:8083"                     # YouTube Shorts scraper
      - "${SOUNDCLOUD_HOST_PORT:-8084}:8084"                 # SoundCloud scraper
      - "${YTMUSIC_HOST_PORT:-8085}:8085"                    # YouTube Music scraper
      - "${SPOTIFY_HOST_PORT:-8086}:8086"                    # Spotify scraper
      - "${DEEZER_HOST_PORT:-8087}:8087"                     # Deezer scraper
      - "${THREADS_HOST_PORT:-8088}:8088"                     # Threads scraper
      - "${TWITTER_HOST_PORT:-8089}:8089"                     # Twitter/X scraper
      - "${GLUETUN_CONTROL_HOST_PORT:-8000}:${GLUETUN_CONTROL_PORT:-8000}"  # Gluetun control server
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-nordvpn}
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:-}
      - HTTP_CONTROL_SERVER_API_KEY=${GLUETUN_API_KEY:-secret-key}
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"apikey","apikey":"${GLUETUN_API_KEY:-secret-key}"}
      - HTTP_CONTROL_SERVER_ADDRESS=:${GLUETUN_CONTROL_PORT:-8000}
    healthcheck:
      test: ["CMD-SHELL", "/gluetun-entrypoint healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - scraper-cache:/app/cache
    restart: always
    networks:
      - default
      - dlp-gateway

  server:
    image: ${SERVER_IMAGE:-ghcr.io/pinchana/pinchana-api/server:latest}
    container_name: ${SERVER_CONTAINER_NAME:-pinchana-server}
    network_mode: container:${GLUETUN_CONTAINER_NAME:-gluetun}
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - scraper-cache:/app/cache
      - ./config:/app/config:ro
    env_file:
      - path: .env
        required: false
    environment:
      - CONTAINER_MODE=${CONTAINER_MODE:-false}
      - MODULES_CONFIG=/app/config/modules.yaml
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}
      - GLUETUN_CONTROL_URL=http://localhost:${GLUETUN_CONTROL_PORT:-8000}
      - GLUETUN_API_KEY=${GLUETUN_API_KEY:-secret-key}
      - PINCHANA_API_KEYS=${PINCHANA_API_KEYS:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - TURNSTILE_EXPECTED_HOSTNAME=${TURNSTILE_EXPECTED_HOSTNAME:-}
      - TURNSTILE_EXPECTED_ACTION=${TURNSTILE_EXPECTED_ACTION:-turnstile-spin-v1}
      - TURNSTILE_SESSION_SECRET=${TURNSTILE_SESSION_SECRET:-}
      - TURNSTILE_SESSION_MAX_AGE=${TURNSTILE_SESSION_MAX_AGE:-43200}
      - MOBILE_AUTH_MODE=${MOBILE_AUTH_MODE:-guest}
      - MOBILE_AUTH_REQUIRED=${MOBILE_AUTH_REQUIRED:-false}
      - MOBILE_SESSION_SECRET=${MOBILE_SESSION_SECRET:-}
      - MOBILE_SESSION_DB_PATH=/app/cache/mobile-sessions.sqlite3
      - MOBILE_ACCESS_TOKEN_MAX_AGE=${MOBILE_ACCESS_TOKEN_MAX_AGE:-900}
      - MOBILE_REFRESH_TOKEN_MAX_AGE=${MOBILE_REFRESH_TOKEN_MAX_AGE:-2592000}
      - MOBILE_CHALLENGE_TTL=${MOBILE_CHALLENGE_TTL:-120}
      - MOBILE_CHALLENGE_RATE_WINDOW=${MOBILE_CHALLENGE_RATE_WINDOW:-600}
      - MOBILE_CHALLENGE_RATE_LIMIT=${MOBILE_CHALLENGE_RATE_LIMIT:-10}
      - MOBILE_TRUST_PROXY_HEADERS=${MOBILE_TRUST_PROXY_HEADERS:-false}
      - MOBILE_GUEST_SCOPES=${MOBILE_GUEST_SCOPES:-mobile:scrape,mobile:media,mobile:capabilities}
      - MOBILE_ATTESTATION_URL=${MOBILE_ATTESTATION_URL:-}
      - MOBILE_ATTESTATION_TOKEN=${MOBILE_ATTESTATION_TOKEN:-}
      - PINCHANA_INSTANCE_CERTIFICATE=${PINCHANA_INSTANCE_CERTIFICATE:-}
      - PINCHANA_INSTANCE_CERTIFICATE_FILE=${PINCHANA_INSTANCE_CERTIFICATE_FILE:-}
      - DLP_ENABLED=${DLP_ENABLED:-false}
      - DLP_URL=http://dlp-api:8080
      - DLP_GATEWAY_TOKEN=${DLP_GATEWAY_TOKEN:-}
      - DLP_OWNER_SECRET=${DLP_OWNER_SECRET:-}
      - MODULE_NETWORK=container:${GLUETUN_CONTAINER_NAME:-gluetun}
      - MODULE_TIKTOK_PORT=${MODULE_TIKTOK_PORT:-8081}
      - MODULE_INSTAGRAM_PORT=${MODULE_INSTAGRAM_PORT:-8082}
      - MODULE_SHORTS_PORT=${MODULE_SHORTS_PORT:-8083}
      - MODULE_SOUNDCLOUD_PORT=${MODULE_SOUNDCLOUD_PORT:-8084}
      - MODULE_YTMUSIC_PORT=${MODULE_YTMUSIC_PORT:-8085}
      - MODULE_SPOTIFY_PORT=${MODULE_SPOTIFY_PORT:-8086}
      - MODULE_DEEZER_PORT=${MODULE_DEEZER_PORT:-8087}
      - MODULE_THREADS_PORT=${MODULE_THREADS_PORT:-8088}
      - MODULE_TWITTER_PORT=${MODULE_TWITTER_PORT:-8089}
      - MODULE_TIKTOK_ENDPOINT=${MODULE_TIKTOK_ENDPOINT:-http://localhost:8081}
      - MODULE_INSTAGRAM_ENDPOINT=${MODULE_INSTAGRAM_ENDPOINT:-http://localhost:8082}
      - MODULE_SHORTS_ENDPOINT=${MODULE_SHORTS_ENDPOINT:-http://localhost:8083}
      - MODULE_SOUNDCLOUD_ENDPOINT=${MODULE_SOUNDCLOUD_ENDPOINT:-http://localhost:8084}
      - MODULE_YTMUSIC_ENDPOINT=${MODULE_YTMUSIC_ENDPOINT:-http://localhost:8085}
      - MODULE_SPOTIFY_ENDPOINT=${MODULE_SPOTIFY_ENDPOINT:-http://localhost:8086}
      - MODULE_DEEZER_ENDPOINT=${MODULE_DEEZER_ENDPOINT:-http://localhost:8087}
      - MODULE_THREADS_ENDPOINT=${MODULE_THREADS_ENDPOINT:-http://localhost:8088}
      - MODULE_TWITTER_ENDPOINT=${MODULE_TWITTER_ENDPOINT:-http://localhost:8089}
    restart: always

  tiktok:
    image: ${TIKTOK_IMAGE:-ghcr.io/pinchana/pinchana-api/tiktok:latest}
    container_name: ${TIKTOK_CONTAINER_NAME:-pinchana-tiktok}
    network_mode: container:${GLUETUN_CONTAINER_NAME:-gluetun}
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - scraper-cache:/app/cache
    environment:
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}
      - YTDLP_CONCURRENCY=${YTDLP_CONCURRENCY:-1}
      - TIKTOK_DIRECT_WEB_PRIMARY=${TIKTOK_DIRECT_WEB_PRIMARY:-false}
      - TIKTOK_REQUEST_INTERVAL_SECONDS=${TIKTOK_REQUEST_INTERVAL_SECONDS:-2.0}
      - TIKTOK_INTERNAL_REQUEST_INTERVAL_SECONDS=${TIKTOK_INTERNAL_REQUEST_INTERVAL_SECONDS:-0}
      - TIKTOK_RETRY_DELAY_SECONDS=${TIKTOK_RETRY_DELAY_SECONDS:-2.0}
      - TIKTOK_FORMAT_ATTEMPTS=${TIKTOK_FORMAT_ATTEMPTS:-3}
      - TIKTOK_TRANSCODE_HEVC=${TIKTOK_TRANSCODE_HEVC:-false}
      - TIKTOK_HEVC_TRANSCODE_TIMEOUT_SECONDS=${TIKTOK_HEVC_TRANSCODE_TIMEOUT_SECONDS:-180}
      - TIKTOK_VPN_ROTATION_COOLDOWN_SECONDS=${TIKTOK_VPN_ROTATION_COOLDOWN_SECONDS:-30}
      - GLUETUN_CONTROL_URL=http://localhost:${GLUETUN_CONTROL_PORT:-8000}
      - GLUETUN_API_KEY=${GLUETUN_API_KEY:-secret-key}
    restart: always

  instagram:
    image: ${INSTAGRAM_IMAGE:-ghcr.io/pinchana/pinchana-api/instagram:latest}
    container_name: ${INSTAGRAM_CONTAINER_NAME:-pinchana-inst}
    network_mode: container:${GLUETUN_CONTAINER_NAME:-gluetun}
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - scraper-cache:/app/cache
    environment:
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}
      - GLUETUN_CONTROL_URL=http://localhost:${GLUETUN_CONTROL_PORT:-8000}
      - GLUETUN_API_KEY=${GLUETUN_API_KEY:-secret-key}
    restart: always

  shorts:
    image: ${SHORTS_IMAGE:-ghcr.io/pinchana/pinchana-api/shorts:latest}
    container_name: ${SHORTS_CONTAINER_NAME:-pinchana-shorts}
    network_mode: container:${GLUETUN_CONTAINER_NAME:-gluetun}
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - scraper-cache:/app/cache
      - ${SHORTS_COOKIES_DIR:-./secrets/yt-cookies}:/run/pinchana-cookies:ro
    environment:
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}
      - GLUETUN_CONTROL_URL=http://localhost:${GLUETUN_CONTROL_PORT:-8000}
      - GLUETUN_API_KEY=${GLUETUN_API_KEY:-secret-key}
      - YTDLP_COOKIES_DIR=/run/pinchana-cookies
      - SHORTS_MAX_MB_PER_MINUTE=${SHORTS_MAX_MB_PER_MINUTE:-18.0}
    restart: always

  soundcloud:
    image: ${SOUNDCLOUD_IMAGE:-ghcr.io/pinchana/pinchana-api/soundcloud:latest}
    container_name: ${SOUNDCLOUD_CONTAINER_NAME:-pinchana-soundcloud}
    network_mode: container:${GLUETUN_CONTAINER_NAME:-gluetun}
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - scraper-cache:/app/cache
    environment:
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}
      - GLUETUN_CONTROL_URL=http://localhost:${GLUETUN_CONTROL_PORT:-8000}
      - GLUETUN_API_KEY=${GLUETUN_API_KEY:-secret-key}
    restart: always

  ytmusic:
    image: ${YTMUSIC_IMAGE:-ghcr.io/pinchana/pinchana-api/ytmusic:latest}
    container_name: ${YTMUSIC_CONTAINER_NAME:-pinchana-ytmusic}
    network_mode: container:${GLUETUN_CONTAINER_NAME:-gluetun}
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - scraper-cache:/app/cache
    environment:
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}
      - GLUETUN_CONTROL_URL=http://localhost:${GLUETUN_CONTROL_PORT:-8000}
      - GLUETUN_API_KEY=${GLUETUN_API_KEY:-secret-key}
    restart: always

  spotify:
    image: ${SPOTIFY_IMAGE:-ghcr.io/pinchana/pinchana-api/spotify:latest}
    container_name: ${SPOTIFY_CONTAINER_NAME:-pinchana-spotify}
    network_mode: container:${GLUETUN_CONTAINER_NAME:-gluetun}
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - scraper-cache:/app/cache
    environment:
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}
      - GLUETUN_CONTROL_URL=http://localhost:${GLUETUN_CONTROL_PORT:-8000}
      - GLUETUN_API_KEY=${GLUETUN_API_KEY:-secret-key}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
    restart: always

  deezer:
    image: ${DEEZER_IMAGE:-ghcr.io/pinchana/pinchana-api/deezer:latest}
    container_name: ${DEEZER_CONTAINER_NAME:-pinchana-deezer}
    network_mode: container:${GLUETUN_CONTAINER_NAME:-gluetun}
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - scraper-cache:/app/cache
    environment:
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}
      - GLUETUN_CONTROL_URL=http://localhost:${GLUETUN_CONTROL_PORT:-8000}
      - GLUETUN_API_KEY=${GLUETUN_API_KEY:-secret-key}
    restart: always

  threads:
    image: ${THREADS_IMAGE:-ghcr.io/pinchana/pinchana-api/threads:latest}
    container_name: ${THREADS_CONTAINER_NAME:-pinchana-threads}
    network_mode: container:${GLUETUN_CONTAINER_NAME:-gluetun}
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - scraper-cache:/app/cache
    environment:
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}
      - GLUETUN_CONTROL_URL=http://localhost:${GLUETUN_CONTROL_PORT:-8000}
      - GLUETUN_API_KEY=${GLUETUN_API_KEY:-secret-key}
    restart: always

  twitter:
    image: ${TWITTER_IMAGE:-ghcr.io/pinchana/pinchana-api/twitter:latest}
    container_name: ${TWITTER_CONTAINER_NAME:-pinchana-twitter}
    network_mode: container:${GLUETUN_CONTAINER_NAME:-gluetun}
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - scraper-cache:/app/cache
    environment:
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}
      - GLUETUN_CONTROL_URL=http://localhost:${GLUETUN_CONTROL_PORT:-8000}
      - GLUETUN_API_KEY=${GLUETUN_API_KEY:-secret-key}
    restart: always

  dlp-redis:
    profiles: ["dlp"]
    image: redis:7.4.5-alpine
    command: ["redis-server", "--requirepass", "${DLP_REDIS_PASSWORD:-dlp-disabled-change-me}", "--appendonly", "no", "--save", ""]
    environment:
      - REDISCLI_AUTH=${DLP_REDIS_PASSWORD:-dlp-disabled-change-me}
    networks: [dlp-backend]
    user: "999:1000"
    read_only: true
    tmpfs: ["/data:rw,noexec,nosuid,nodev,size=64m,uid=999,gid=1000,mode=0700"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  dlp-api:
    profiles: ["dlp"]
    image: ${DLP_API_IMAGE:-ghcr.io/pinchana/pinchana-api/dlp-api:latest}
    environment:
      - REDIS_URL=redis://:${DLP_REDIS_PASSWORD:-dlp-disabled-change-me}@dlp-redis:6379/0
      - JOBS_DIR=/data/jobs
      - DLP_GATEWAY_TOKEN=${DLP_GATEWAY_TOKEN:-dlp-disabled-change-me}
      - JOB_TTL_SECONDS=${DLP_JOB_TTL_SECONDS:-7200}
      - KEY_TTL_SECONDS=${DLP_KEY_TTL_SECONDS:-300}
      - MAX_ACTIVE_JOBS=${DLP_MAX_ACTIVE_JOBS:-3}
      - RATE_LIMIT_PER_MINUTE=${DLP_RATE_LIMIT_PER_MINUTE:-10}
      - MAX_OUTPUT_BYTES=${DLP_MAX_OUTPUT_BYTES:-8589934592}
      - DLP_DOH_URL=${DLP_DOH_URL:-https://cloudflare-dns.com/dns-query}
      - DLP_DOH_PROXY_URL=http://dlp-vpn:8888
    volumes:
      - ${DLP_HOST_JOBS_DIR:-/tmp/pinchana-dlp-jobs}:/data/jobs:ro
    depends_on:
      dlp-redis:
        condition: service_healthy
      dlp-vpn:
        condition: service_healthy
    networks: [dlp-backend, dlp-gateway, dlp-worker]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  dlp-orchestrator:
    profiles: ["dlp"]
    image: ${DLP_ORCHESTRATOR_IMAGE:-ghcr.io/pinchana/pinchana-api/dlp-orchestrator:latest}
    environment:
      - REDIS_URL=redis://:${DLP_REDIS_PASSWORD:-dlp-disabled-change-me}@dlp-redis:6379/0
      - WORKER_IMAGE=${DLP_WORKER_IMAGE:-ghcr.io/pinchana/pinchana-api/dlp-worker:latest}
      - WORKER_NETWORK=${DLP_WORKER_NETWORK:-pinchana-dlp-worker}
      - DLP_API_URL=http://dlp-api:8080
      - HOST_JOBS_DIR=${DLP_HOST_JOBS_DIR:-/tmp/pinchana-dlp-jobs}
      - MAX_OUTPUT_BYTES=${DLP_MAX_OUTPUT_BYTES:-8589934592}
      - EXECUTION_TIMEOUT_SECONDS=${DLP_EXECUTION_TIMEOUT_SECONDS:-2700}
      - VPN_PROXY_URL=http://dlp-vpn:8888
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DLP_HOST_JOBS_DIR:-/tmp/pinchana-dlp-jobs}:${DLP_HOST_JOBS_DIR:-/tmp/pinchana-dlp-jobs}
    depends_on:
      dlp-redis:
        condition: service_healthy
      dlp-api:
        condition: service_healthy
      dlp-vpn:
        condition: service_healthy
    networks: [dlp-backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import time; p=Path('/tmp/orchestrator-ready'); raise SystemExit(0 if p.exists() and time.time() - p.stat().st_mtime < 20 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  dlp-vpn:
    profiles: ["dlp"]
    image: ${DLP_VPN_IMAGE:-qmcgaw/gluetun:v3.40.0}
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-nordvpn}
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:-}
      - HTTPPROXY=on
      - HTTPPROXY_LISTENING_ADDRESS=:8888
    networks: [dlp-worker, dlp-egress]
    healthcheck:
      test: ["CMD-SHELL", "/gluetun-entrypoint healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  scraper-cache:

networks:
  dlp-backend:
    internal: true
  dlp-gateway:
    internal: true
  dlp-worker:
    name: ${DLP_WORKER_NETWORK:-pinchana-dlp-worker}
    internal: true
  dlp-egress: {}
