[project]
name = "pinchana-ytgroups"
version = "26.11.7"
description = "Optimized YouTube videos for Pinchana Telegram groups"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pinchana-core",
    "fastapi>=0.162.2",
    "yt-dlp[default,deno]>=2026.10.26",
]

[tool.uv.sources]
pinchana-core = { path = "../pinchana-core" }

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
