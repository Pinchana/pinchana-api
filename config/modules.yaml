modules:
  tiktok:
    enabled: true
    route_patterns: ["tiktok.com", "vm.tiktok.com", "vt.tiktok.com"]
    source:
      type: local
      path: /modules/pinchana-tiktok
    container:
      dockerfile: Dockerfile
      port: "${MODULE_TIKTOK_PORT:-8081}"
      endpoint: "${MODULE_TIKTOK_ENDPOINT:-http://localhost:8081}"
      image_tag: "${MODULE_TIKTOK_IMAGE_TAG:-pinchana-module-tiktok}"
      container_name: "${MODULE_TIKTOK_CONTAINER_NAME:-pinchana-tiktok}"
      network: "${MODULE_NETWORK:-container:gluetun}"
      cache_volume: "${MODULE_CACHE_VOLUME:-scraper-cache}"
      env:
        CACHE_MAX_SIZE_GB: "${CACHE_MAX_SIZE_GB:-10.0}"

  instagram:
    enabled: true
    route_patterns: ["instagram.com", "instagr.am"]
    source:
      type: local
      path: /modules/pinchana-inst
    container:
      dockerfile: Dockerfile
      port: "${MODULE_INSTAGRAM_PORT:-8082}"
      endpoint: "${MODULE_INSTAGRAM_ENDPOINT:-http://localhost:8082}"
      image_tag: "${MODULE_INSTAGRAM_IMAGE_TAG:-pinchana-module-inst}"
      container_name: "${MODULE_INSTAGRAM_CONTAINER_NAME:-pinchana-inst}"
      network: "${MODULE_NETWORK:-container:gluetun}"
      cache_volume: "${MODULE_CACHE_VOLUME:-scraper-cache}"
      env:
        CACHE_MAX_SIZE_GB: "${CACHE_MAX_SIZE_GB:-10.0}"

  shorts:
    enabled: true
    route_patterns: ["youtube.com/shorts", "www.youtube.com/shorts", "m.youtube.com/shorts"]
    source:
      type: local
      path: /modules/pinchana-shorts
    container:
      dockerfile: Dockerfile
      port: "${MODULE_SHORTS_PORT:-8083}"
      endpoint: "${MODULE_SHORTS_ENDPOINT:-http://localhost:8083}"
      image_tag: "${MODULE_SHORTS_IMAGE_TAG:-pinchana-module-shorts}"
      container_name: "${MODULE_SHORTS_CONTAINER_NAME:-pinchana-shorts}"
      network: "${MODULE_NETWORK:-container:gluetun}"
      cache_volume: "${MODULE_CACHE_VOLUME:-scraper-cache}"
      env:
        CACHE_MAX_SIZE_GB: "${CACHE_MAX_SIZE_GB:-10.0}"
        YTDLP_COOKIES_DIR: "${YTDLP_COOKIES_DIR:-/run/pinchana-cookies}"
        SHORTS_MAX_MB_PER_MINUTE: "${SHORTS_MAX_MB_PER_MINUTE:-18.0}"

  soundcloud:
    enabled: true
    route_patterns: ["soundcloud.com", "on.soundcloud.com"]
    source:
      type: local
      path: /modules/pinchana-soundcloud
    container:
      dockerfile: Dockerfile
      port: "${MODULE_SOUNDCLOUD_PORT:-8084}"
      endpoint: "${MODULE_SOUNDCLOUD_ENDPOINT:-http://localhost:8084}"
      image_tag: "${MODULE_SOUNDCLOUD_IMAGE_TAG:-pinchana-module-soundcloud}"
      container_name: "${MODULE_SOUNDCLOUD_CONTAINER_NAME:-pinchana-soundcloud}"
      network: "${MODULE_NETWORK:-container:gluetun}"
      cache_volume: "${MODULE_CACHE_VOLUME:-scraper-cache}"
      env:
        CACHE_MAX_SIZE_GB: "${CACHE_MAX_SIZE_GB:-10.0}"

  ytmusic:
    enabled: true
    route_patterns: ["music.youtube.com"]
    source:
      type: local
      path: /modules/pinchana-ytmusic
    container:
      dockerfile: Dockerfile
      port: "${MODULE_YTMUSIC_PORT:-8085}"
      endpoint: "${MODULE_YTMUSIC_ENDPOINT:-http://localhost:8085}"
      image_tag: "${MODULE_YTMUSIC_IMAGE_TAG:-pinchana-module-ytmusic}"
      container_name: "${MODULE_YTMUSIC_CONTAINER_NAME:-pinchana-ytmusic}"
      network: "${MODULE_NETWORK:-container:gluetun}"
      cache_volume: "${MODULE_CACHE_VOLUME:-scraper-cache}"
      env:
        CACHE_MAX_SIZE_GB: "${CACHE_MAX_SIZE_GB:-10.0}"

  spotify:
    enabled: true
    route_patterns: ["open.spotify.com"]
    source:
      type: local
      path: /modules/pinchana-spotify
    container:
      dockerfile: Dockerfile
      port: "${MODULE_SPOTIFY_PORT:-8086}"
      endpoint: "${MODULE_SPOTIFY_ENDPOINT:-http://localhost:8086}"
      image_tag: "${MODULE_SPOTIFY_IMAGE_TAG:-pinchana-module-spotify}"
      container_name: "${MODULE_SPOTIFY_CONTAINER_NAME:-pinchana-spotify}"
      network: "${MODULE_NETWORK:-container:gluetun}"
      cache_volume: "${MODULE_CACHE_VOLUME:-scraper-cache}"
      env:
        CACHE_MAX_SIZE_GB: "${CACHE_MAX_SIZE_GB:-10.0}"
        SPOTIFY_CLIENT_ID: "${SPOTIFY_CLIENT_ID}"
        SPOTIFY_CLIENT_SECRET: "${SPOTIFY_CLIENT_SECRET}"

  deezer:
    enabled: true
    route_patterns: ["deezer.com", "deezer.page.link", "link.deezer.com"]
    source:
      type: local
      path: /modules/pinchana-deezer
    container:
      dockerfile: Dockerfile
      port: "${MODULE_DEEZER_PORT:-8087}"
      endpoint: "${MODULE_DEEZER_ENDPOINT:-http://localhost:8087}"
      image_tag: "${MODULE_DEEZER_IMAGE_TAG:-pinchana-module-deezer}"
      container_name: "${MODULE_DEEZER_CONTAINER_NAME:-pinchana-deezer}"
      network: "${MODULE_NETWORK:-container:gluetun}"
      cache_volume: "${MODULE_CACHE_VOLUME:-scraper-cache}"
      env:
        CACHE_MAX_SIZE_GB: "${CACHE_MAX_SIZE_GB:-10.0}"

  threads:
    enabled: true
    route_patterns: ["threads.net", "threads.com"]
    source:
      type: local
      path: /modules/pinchana-threads
    container:
      dockerfile: Dockerfile
      port: "${MODULE_THREADS_PORT:-8088}"
      endpoint: "${MODULE_THREADS_ENDPOINT:-http://localhost:8088}"
      image_tag: "${MODULE_THREADS_IMAGE_TAG:-pinchana-module-threads}"
      container_name: "${MODULE_THREADS_CONTAINER_NAME:-pinchana-threads}"
      network: "${MODULE_NETWORK:-container:gluetun}"
      cache_volume: "${MODULE_CACHE_VOLUME:-scraper-cache}"
      env:
        CACHE_MAX_SIZE_GB: "${CACHE_MAX_SIZE_GB:-10.0}"

  twitter:
    enabled: true
    route_patterns: ["x.com", "twitter.com", "vxtwitter.com", "fxtwitter.com"]
    source:
      type: local
      path: /modules/pinchana-twitter
    container:
      dockerfile: Dockerfile
      port: "${MODULE_TWITTER_PORT:-8089}"
      endpoint: "${MODULE_TWITTER_ENDPOINT:-http://localhost:8089}"
      image_tag: "${MODULE_TWITTER_IMAGE_TAG:-pinchana-module-twitter}"
      container_name: "${MODULE_TWITTER_CONTAINER_NAME:-pinchana-twitter}"
      network: "${MODULE_NETWORK:-container:gluetun}"
      cache_volume: "${MODULE_CACHE_VOLUME:-scraper-cache}"
      env:
        CACHE_MAX_SIZE_GB: "${CACHE_MAX_SIZE_GB:-10.0}"
