modules:
  tiktok:
    enabled: true
    route_patterns: ["tiktok.com", "vm.tiktok.com", "vt.tiktok.com"]
    source:
      type: local
      path: /modules/pinchana-tiktok
    container:
      dockerfile: Dockerfile
      port: "${MODULE_TIKTOK_PORT:-8081}"
      endpoint: "${MODULE_TIKTOK_ENDPOINT:-http://localhost:8081}"
      image_tag: "${MODULE_TIKTOK_IMAGE_TAG:-pinchana-module-tiktok}"
      container_name: "${MODULE_TIKTOK_CONTAINER_NAME:-pinchana-tiktok}"
      network: "${MODULE_NETWORK:-container:gluetun}"
      cache_volume: "${MODULE_CACHE_VOLUME:-scraper-cache}"
      env:
        CACHE_MAX_SIZE_GB: "${CACHE_MAX_SIZE_GB:-10.0}"

  instagram:
    enabled: true
    route_patterns: ["instagram.com", "instagr.am"]
    source:
      type: local
      path: /modules/pinchana-inst
    container:
      dockerfile: Dockerfile
      port: "${MODULE_INSTAGRAM_PORT:-8082}"
      endpoint: "${MODULE_INSTAGRAM_ENDPOINT:-http://localhost:8082}"
      image_tag: "${MODULE_INSTAGRAM_IMAGE_TAG:-pinchana-module-inst}"
      container_name: "${MODULE_INSTAGRAM_CONTAINER_NAME:-pinchana-inst}"
      network: "${MODULE_NETWORK:-container:gluetun}"
      cache_volume: "${MODULE_CACHE_VOLUME:-scraper-cache}"
      env:
        CACHE_MAX_SIZE_GB: "${CACHE_MAX_SIZE_GB:-10.0}"

  shorts:
    enabled: true
    route_patterns: ["youtube.com/shorts", "www.youtube.com/shorts", "m.youtube.com/shorts"]
    source:
      type: local
      path: /modules/pinchana-shorts
    container:
      dockerfile: Dockerfile
      port: "${MODULE_SHORTS_PORT:-8083}"
      endpoint: "${MODULE_SHORTS_ENDPOINT:-http://localhost:8083}"
      image_tag: "${MODULE_SHORTS_IMAGE_TAG:-pinchana-module-shorts}"
      container_name: "${MODULE_SHORTS_CONTAINER_NAME:-pinchana-shorts}"
      network: "${MODULE_NETWORK:-container:gluetun}"
      cache_volume: "${MODULE_CACHE_VOLUME:-scraper-cache}"
      env:
        CACHE_MAX_SIZE_GB: "${CACHE_MAX_SIZE_GB:-10.0}"
        YTDLP_COOKIES_DIR: "${YTDLP_COOKIES_DIR:-/run/pinchana-cookies}"
        SHORTS_MAX_MB_PER_MINUTE: "${SHORTS_MAX_MB_PER_MINUTE:-18.0}"
