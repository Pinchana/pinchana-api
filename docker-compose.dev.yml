services:
  gluetun:
    profiles: ["vpn"]
    image: ${GLUETUN_IMAGE:-qmcgaw/gluetun:v3}
    container_name: ${GLUETUN_CONTAINER_NAME:-gluetun}
    dns:
      - 1.1.1.1
      - 1.0.0.1
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${API_HOST_PORT:-8080}:8080"                         # Server API
      - "${TIKTOK_HOST_PORT:-8081}:8081"                     # TikTok scraper
      - "${INSTAGRAM_HOST_PORT:-8082}:8082"                  # Instagram scraper
      - "${SHORTS_HOST_PORT:-8083}:8083"                     # YouTube Shorts scraper
      - "${SOUNDCLOUD_HOST_PORT:-8084}:8084"                 # SoundCloud scraper
      - "${YTMUSIC_HOST_PORT:-8085}:8085"                    # YouTube Music scraper
      - "${SPOTIFY_HOST_PORT:-8086}:8086"                    # Spotify scraper
      - "${DEEZER_HOST_PORT:-8087}:8087"                     # Deezer scraper
      - "${THREADS_HOST_PORT:-8088}:8088"                     # Threads scraper
      - "${TWITTER_HOST_PORT:-8089}:8089"                     # Twitter/X scraper
      - "${COUB_HOST_PORT:-8090}:8090"                         # Coub scraper
      - "${GLUETUN_CONTROL_BIND_ADDRESS:-127.0.0.1}:${GLUETUN_CONTROL_HOST_PORT:-8000}:${GLUETUN_CONTROL_PORT:-8000}"  # Gluetun control server
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-nordvpn}
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:-}
      - DNS_UPSTREAM_RESOLVER_TYPE=dot
      - DNS_UPSTREAM_RESOLVERS=cloudflare
      - DNS_CACHING=on
      - HEALTH_ICMP_TARGET_IPS=1.1.1.1,1.0.0.1
      - HTTP_CONTROL_SERVER_API_KEY=${GLUETUN_API_KEY:-secret-key}
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"apikey","apikey":"${GLUETUN_API_KEY:-secret-key}"}
      - HTTP_CONTROL_SERVER_ADDRESS=:${GLUETUN_CONTROL_PORT:-8000}
    healthcheck:
      test: ["CMD-SHELL", "/gluetun-entrypoint healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - scraper-cache:/app/cache
    networks: [default]

  server:
    build:
      context: .
      dockerfile: ./pinchana-server/Dockerfile
    container_name: ${SERVER_CONTAINER_NAME:-pinchana-server-dev}
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - scraper-cache:/app/cache
      - ./config:/app/config:ro
    env_file:
      - path: .env
        required: false
    environment:
      - CONTAINER_MODE=${CONTAINER_MODE:-false}
      - VPN_ENABLED=false
      - MODULES_CONFIG=/app/config/modules.yaml
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}
      - GLUETUN_CONTROL_URL=http://localhost:${GLUETUN_CONTROL_PORT:-8000}
      - GLUETUN_API_KEY=${GLUETUN_API_KEY:-secret-key}
      - PINCHANA_API_KEYS=${PINCHANA_API_KEYS:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - TURNSTILE_EXPECTED_HOSTNAME=${TURNSTILE_EXPECTED_HOSTNAME:-}
      - TURNSTILE_EXPECTED_ACTION=${TURNSTILE_EXPECTED_ACTION:-turnstile-spin-v1}
      - TURNSTILE_SESSION_SECRET=${TURNSTILE_SESSION_SECRET:-}
      - TURNSTILE_SESSION_MAX_AGE=${TURNSTILE_SESSION_MAX_AGE:-43200}
      - MOBILE_AUTH_MODE=${MOBILE_AUTH_MODE:-guest}
      - MOBILE_AUTH_REQUIRED=${MOBILE_AUTH_REQUIRED:-false}
      - MOBILE_SESSION_SECRET=${MOBILE_SESSION_SECRET:-}
      - MOBILE_SESSION_DB_PATH=/app/cache/mobile-sessions.sqlite3
      - MOBILE_ACCESS_TOKEN_MAX_AGE=${MOBILE_ACCESS_TOKEN_MAX_AGE:-900}
      - MOBILE_REFRESH_TOKEN_MAX_AGE=${MOBILE_REFRESH_TOKEN_MAX_AGE:-2592000}
      - MOBILE_CHALLENGE_TTL=${MOBILE_CHALLENGE_TTL:-120}
      - MOBILE_CHALLENGE_RATE_WINDOW=${MOBILE_CHALLENGE_RATE_WINDOW:-600}
      - MOBILE_CHALLENGE_RATE_LIMIT=${MOBILE_CHALLENGE_RATE_LIMIT:-10}
      - MOBILE_TRUST_PROXY_HEADERS=${MOBILE_TRUST_PROXY_HEADERS:-false}
      - MOBILE_GUEST_SCOPES=${MOBILE_GUEST_SCOPES:-mobile:scrape,mobile:media,mobile:capabilities,mobile:dlp}
      - MOBILE_ATTESTATION_URL=${MOBILE_ATTESTATION_URL:-}
      - MOBILE_ATTESTATION_TOKEN=${MOBILE_ATTESTATION_TOKEN:-}
      - PINCHANA_INSTANCE_CERTIFICATE=${PINCHANA_INSTANCE_CERTIFICATE:-}
      - PINCHANA_INSTANCE_CERTIFICATE_FILE=${PINCHANA_INSTANCE_CERTIFICATE_FILE:-}
      - DLP_ENABLED=${DLP_ENABLED:-false}
      - DLP_URL=http://dlp-api:8080
      - DLP_GATEWAY_TOKEN=${DLP_GATEWAY_TOKEN:-}
      - DLP_OWNER_SECRET=${DLP_OWNER_SECRET:-}
      - MODULE_TIKTOK_PORT=${MODULE_TIKTOK_PORT:-8081}
      - MODULE_INSTAGRAM_PORT=${MODULE_INSTAGRAM_PORT:-8082}
      - MODULE_SHORTS_PORT=${MODULE_SHORTS_PORT:-8083}
      - MODULE_SOUNDCLOUD_PORT=${MODULE_SOUNDCLOUD_PORT:-8084}
      - MODULE_YTMUSIC_PORT=${MODULE_YTMUSIC_PORT:-8085}
      - MODULE_SPOTIFY_PORT=${MODULE_SPOTIFY_PORT:-8086}
      - MODULE_DEEZER_PORT=${MODULE_DEEZER_PORT:-8087}
      - MODULE_THREADS_PORT=${MODULE_THREADS_PORT:-8088}
      - MODULE_TWITTER_PORT=${MODULE_TWITTER_PORT:-8089}
      - MODULE_COUB_PORT=${MODULE_COUB_PORT:-8090}
      - MODULE_TIKTOK_ENDPOINT=${DEV_MODULE_TIKTOK_ENDPOINT:-http://tiktok:8081}
      - MODULE_INSTAGRAM_ENDPOINT=${DEV_MODULE_INSTAGRAM_ENDPOINT:-http://instagram:8082}
      - MODULE_SHORTS_ENDPOINT=${DEV_MODULE_SHORTS_ENDPOINT:-http://shorts:8083}
      - MODULE_SOUNDCLOUD_ENDPOINT=${DEV_MODULE_SOUNDCLOUD_ENDPOINT:-http://soundcloud:8084}
      - MODULE_YTMUSIC_ENDPOINT=${DEV_MODULE_YTMUSIC_ENDPOINT:-http://ytmusic:8085}
      - MODULE_SPOTIFY_ENDPOINT=${DEV_MODULE_SPOTIFY_ENDPOINT:-http://spotify:8086}
      - MODULE_DEEZER_ENDPOINT=${DEV_MODULE_DEEZER_ENDPOINT:-http://deezer:8087}
      - MODULE_THREADS_ENDPOINT=${DEV_MODULE_THREADS_ENDPOINT:-http://threads:8088}
      - MODULE_TWITTER_ENDPOINT=${DEV_MODULE_TWITTER_ENDPOINT:-http://twitter:8089}
      - MODULE_COUB_ENDPOINT=${DEV_MODULE_COUB_ENDPOINT:-http://coub:8090}
    networks: [default, dlp-gateway]

  tiktok:
    build:
      context: .
      dockerfile: ./pinchana-tiktok/Dockerfile
    container_name: ${TIKTOK_CONTAINER_NAME:-pinchana-tiktok-dev}
    ports:
      - "${TIKTOK_HOST_PORT:-8081}:8081"
    volumes:
      - scraper-cache:/app/cache
    environment:
      - VPN_ENABLED=false
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}
      - YTDLP_CONCURRENCY=${YTDLP_CONCURRENCY:-1}
      - TIKTOK_DIRECT_WEB_PRIMARY=${TIKTOK_DIRECT_WEB_PRIMARY:-false}
      - TIKTOK_REQUEST_INTERVAL_SECONDS=${TIKTOK_REQUEST_INTERVAL_SECONDS:-2.0}
      - TIKTOK_INTERNAL_REQUEST_INTERVAL_SECONDS=${TIKTOK_INTERNAL_REQUEST_INTERVAL_SECONDS:-0}
      - TIKTOK_RETRY_DELAY_SECONDS=${TIKTOK_RETRY_DELAY_SECONDS:-2.0}
      - TIKTOK_FORMAT_ATTEMPTS=${TIKTOK_FORMAT_ATTEMPTS:-3}
      - TIKTOK_TRANSCODE_HEVC=${TIKTOK_TRANSCODE_HEVC:-false}
      - TIKTOK_HEVC_TRANSCODE_TIMEOUT_SECONDS=${TIKTOK_HEVC_TRANSCODE_TIMEOUT_SECONDS:-180}
      - TIKTOK_VPN_ROTATION_COOLDOWN_SECONDS=${TIKTOK_VPN_ROTATION_COOLDOWN_SECONDS:-30}
      - GLUETUN_CONTROL_URL=http://localhost:${GLUETUN_CONTROL_PORT:-8000}
      - GLUETUN_API_KEY=${GLUETUN_API_KEY:-secret-key}

  instagram:
    build:
      context: .
      dockerfile: ./pinchana-inst/Dockerfile
    container_name: ${INSTAGRAM_CONTAINER_NAME:-pinchana-inst-dev}
    ports:
      - "${INSTAGRAM_HOST_PORT:-8082}:8082"
    volumes:
      - scraper-cache:/app/cache
    environment:
      - VPN_ENABLED=false
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}
      - GLUETUN_CONTROL_URL=http://localhost:${GLUETUN_CONTROL_PORT:-8000}
      - GLUETUN_API_KEY=${GLUETUN_API_KEY:-secret-key}

  shorts:
    build:
      context: .
      dockerfile: ./pinchana-shorts/Dockerfile
    container_name: ${SHORTS_CONTAINER_NAME:-pinchana-shorts-dev}
    ports:
      - "${SHORTS_HOST_PORT:-8083}:8083"
    volumes:
      - scraper-cache:/app/cache
      - ${SHORTS_COOKIES_DIR:-./secrets/yt-cookies}:/run/pinchana-cookies:ro
    environment:
      - VPN_ENABLED=false
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}
      - GLUETUN_CONTROL_URL=http://localhost:${GLUETUN_CONTROL_PORT:-8000}
      - GLUETUN_API_KEY=${GLUETUN_API_KEY:-secret-key}
      - YTDLP_COOKIES_DIR=/run/pinchana-cookies
      - SHORTS_MAX_MB_PER_MINUTE=${SHORTS_MAX_MB_PER_MINUTE:-18.0}

  soundcloud:
    build:
      context: .
      dockerfile: ./pinchana-soundcloud/Dockerfile
    container_name: ${SOUNDCLOUD_CONTAINER_NAME:-pinchana-soundcloud-dev}
    ports:
      - "${SOUNDCLOUD_HOST_PORT:-8084}:8084"
    volumes:
      - scraper-cache:/app/cache
    environment:
      - VPN_ENABLED=false
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}
      - GLUETUN_CONTROL_URL=http://localhost:${GLUETUN_CONTROL_PORT:-8000}
      - GLUETUN_API_KEY=${GLUETUN_API_KEY:-secret-key}

  ytmusic:
    build:
      context: .
      dockerfile: ./pinchana-ytmusic/Dockerfile
    container_name: ${YTMUSIC_CONTAINER_NAME:-pinchana-ytmusic-dev}
    ports:
      - "${YTMUSIC_HOST_PORT:-8085}:8085"
    volumes:
      - scraper-cache:/app/cache
    environment:
      - VPN_ENABLED=false
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}
      - GLUETUN_CONTROL_URL=http://localhost:${GLUETUN_CONTROL_PORT:-8000}
      - GLUETUN_API_KEY=${GLUETUN_API_KEY:-secret-key}

  spotify:
    build:
      context: .
      dockerfile: ./pinchana-spotify/Dockerfile
    container_name: ${SPOTIFY_CONTAINER_NAME:-pinchana-spotify-dev}
    ports:
      - "${SPOTIFY_HOST_PORT:-8086}:8086"
    volumes:
      - scraper-cache:/app/cache
    environment:
      - VPN_ENABLED=false
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}
      - GLUETUN_CONTROL_URL=http://localhost:${GLUETUN_CONTROL_PORT:-8000}
      - GLUETUN_API_KEY=${GLUETUN_API_KEY:-secret-key}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}

  deezer:
    build:
      context: .
      dockerfile: ./pinchana-deezer/Dockerfile
    container_name: ${DEEZER_CONTAINER_NAME:-pinchana-deezer-dev}
    ports:
      - "${DEEZER_HOST_PORT:-8087}:8087"
    volumes:
      - scraper-cache:/app/cache
    environment:
      - VPN_ENABLED=false
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}
      - GLUETUN_CONTROL_URL=http://localhost:${GLUETUN_CONTROL_PORT:-8000}
      - GLUETUN_API_KEY=${GLUETUN_API_KEY:-secret-key}

  threads:
    build:
      context: .
      dockerfile: ./pinchana-threads/Dockerfile
    container_name: ${THREADS_CONTAINER_NAME:-pinchana-threads-dev}
    ports:
      - "${THREADS_HOST_PORT:-8088}:8088"
    volumes:
      - scraper-cache:/app/cache
    environment:
      - VPN_ENABLED=false
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}
      - GLUETUN_CONTROL_URL=http://localhost:${GLUETUN_CONTROL_PORT:-8000}
      - GLUETUN_API_KEY=${GLUETUN_API_KEY:-secret-key}

  twitter:
    build:
      context: .
      dockerfile: ./pinchana-twitter/Dockerfile
    container_name: ${TWITTER_CONTAINER_NAME:-pinchana-twitter-dev}
    ports:
      - "${TWITTER_HOST_PORT:-8089}:8089"
    volumes:
      - scraper-cache:/app/cache
    environment:
      - VPN_ENABLED=false
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}
      - GLUETUN_CONTROL_URL=http://localhost:${GLUETUN_CONTROL_PORT:-8000}
      - GLUETUN_API_KEY=${GLUETUN_API_KEY:-secret-key}

  coub:
    build:
      context: .
      dockerfile: ./pinchana-coub/Dockerfile
    container_name: ${COUB_CONTAINER_NAME:-pinchana-coub-dev}
    ports:
      - "${COUB_HOST_PORT:-8090}:8090"
    volumes:
      - scraper-cache:/app/cache
    environment:
      - VPN_ENABLED=false
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}
      - COUB_FFMPEG_TIMEOUT_SECONDS=${COUB_FFMPEG_TIMEOUT_SECONDS:-300}

  dlp-redis:
    profiles: ["dlp"]
    image: redis:7.4.5-alpine
    command: ["redis-server", "--requirepass", "${DLP_REDIS_PASSWORD:-dlp-disabled-change-me}", "--appendonly", "no", "--save", ""]
    environment:
      - REDISCLI_AUTH=${DLP_REDIS_PASSWORD:-dlp-disabled-change-me}
    networks: [dlp-backend]
    user: "999:1000"
    read_only: true
    tmpfs: ["/data:rw,noexec,nosuid,nodev,size=64m,uid=999,gid=1000,mode=0700"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  dlp-api:
    profiles: ["dlp"]
    build:
      context: ./pinchana-dlp/api
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://:${DLP_REDIS_PASSWORD:-dlp-disabled-change-me}@dlp-redis:6379/0
      - JOBS_DIR=/data/jobs
      - DLP_GATEWAY_TOKEN=${DLP_GATEWAY_TOKEN:-dlp-disabled-change-me}
      - JOB_TTL_SECONDS=${DLP_JOB_TTL_SECONDS:-7200}
      - KEY_TTL_SECONDS=${DLP_KEY_TTL_SECONDS:-300}
      - MAX_ACTIVE_JOBS=${DLP_MAX_ACTIVE_JOBS:-3}
      - RATE_LIMIT_PER_MINUTE=${DLP_RATE_LIMIT_PER_MINUTE:-10}
      - MAX_OUTPUT_BYTES=${DLP_MAX_OUTPUT_BYTES:-8589934592}
      - DLP_DOH_URL=${DLP_DOH_URL:-https://cloudflare-dns.com/dns-query}
      - DLP_DOH_PROXY_URL=http://dlp-vpn:8888
    volumes: [dlp-jobs:/data/jobs:ro]
    depends_on:
      dlp-redis:
        condition: service_healthy
      dlp-vpn:
        condition: service_healthy
    networks: [dlp-backend, dlp-gateway, dlp-worker]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 12

  dlp-orchestrator:
    profiles: ["dlp"]
    build:
      context: ./pinchana-dlp/orchestrator
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://:${DLP_REDIS_PASSWORD:-dlp-disabled-change-me}@dlp-redis:6379/0
      - WORKER_IMAGE=${DLP_WORKER_IMAGE:-pinchana-dlp-worker:latest}
      - WORKER_NETWORK=${DLP_WORKER_NETWORK:-pinchana-dlp-worker}
      - DLP_API_URL=http://dlp-api:8080
      - HOST_JOBS_DIR=${DLP_HOST_JOBS_DIR:-/tmp/pinchana-dlp-jobs-dev}
      - MAX_OUTPUT_BYTES=${DLP_MAX_OUTPUT_BYTES:-8589934592}
      - EXECUTION_TIMEOUT_SECONDS=${DLP_EXECUTION_TIMEOUT_SECONDS:-2700}
      - VPN_PROXY_URL=http://dlp-vpn:8888
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DLP_HOST_JOBS_DIR:-/tmp/pinchana-dlp-jobs-dev}:${DLP_HOST_JOBS_DIR:-/tmp/pinchana-dlp-jobs-dev}
    depends_on:
      dlp-redis:
        condition: service_healthy
      dlp-api:
        condition: service_healthy
      dlp-vpn:
        condition: service_healthy
    networks: [dlp-backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import time; p=Path('/tmp/orchestrator-ready'); raise SystemExit(0 if p.exists() and time.time() - p.stat().st_mtime < 20 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 12

  dlp-vpn:
    profiles: ["dlp"]
    image: ${DLP_VPN_IMAGE:-qmcgaw/gluetun:v3}
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    dns: [1.1.1.1, 1.0.0.1]
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-nordvpn}
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:-}
      - DNS_UPSTREAM_RESOLVER_TYPE=dot
      - DNS_UPSTREAM_RESOLVERS=cloudflare
      - DNS_CACHING=on
      - HEALTH_ICMP_TARGET_IPS=1.1.1.1,1.0.0.1
      - HTTPPROXY=on
      - HTTPPROXY_LISTENING_ADDRESS=:8888
    networks: [dlp-worker, dlp-egress]
    healthcheck:
      test: ["CMD-SHELL", "/gluetun-entrypoint healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  dlp-worker-image:
    profiles: ["dlp-build"]
    image: ${DLP_WORKER_IMAGE:-pinchana-dlp-worker:latest}
    build:
      context: ./pinchana-dlp/worker
      dockerfile: Dockerfile
    entrypoint: ["/bin/true"]

volumes:
  scraper-cache:
  dlp-jobs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DLP_HOST_JOBS_DIR:-/tmp/pinchana-dlp-jobs-dev}

networks:
  dlp-backend:
    internal: true
  dlp-gateway:
    internal: true
  dlp-worker:
    name: ${DLP_WORKER_NETWORK:-pinchana-dlp-worker}
    internal: true
  dlp-egress: {}
