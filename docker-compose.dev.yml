services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8080:8080"      # Server API
      - "8081:8081"      # TikTok scraper
      - "8082:8082"      # Instagram scraper
      - "8000:8000"      # Gluetun control server
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-nordvpn}
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:-}
      - HTTP_CONTROL_SERVER_API_KEY=${GLUETUN_API_KEY:-secret-key}
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"apikey","apikey":"${GLUETUN_API_KEY:-secret-key}"}
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
    healthcheck:
      test: ["CMD-SHELL", "/gluetun-entrypoint healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - scraper-cache:/app/cache

  server:
    build:
      context: .
      dockerfile: ./pinchana-server/Dockerfile
    container_name: pinchana-server-dev
    network_mode: container:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - scraper-cache:/app/cache
      - ./config:/app/config:ro
    environment:
      - CONTAINER_MODE=true
      - MODULES_CONFIG=/app/config/modules.yaml
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}
      - GLUETUN_CONTROL_URL=http://localhost:8000
      - GLUETUN_API_KEY=${GLUETUN_API_KEY:-secret-key}

  tiktok:
    build:
      context: .
      dockerfile: ./pinchana-tiktok/Dockerfile
    container_name: pinchana-tiktok-dev
    network_mode: container:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - scraper-cache:/app/cache
    environment:
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}
      - GLUETUN_CONTROL_URL=http://localhost:8000
      - GLUETUN_API_KEY=${GLUETUN_API_KEY:-secret-key}

  instagram:
    build:
      context: .
      dockerfile: ./pinchana-inst/Dockerfile
    container_name: pinchana-inst-dev
    network_mode: container:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - scraper-cache:/app/cache
    environment:
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}
      - GLUETUN_CONTROL_URL=http://localhost:8000
      - GLUETUN_API_KEY=${GLUETUN_API_KEY:-secret-key}

volumes:
  scraper-cache:
